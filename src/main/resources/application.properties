spring.application.name=home-budget-api

# In-memory H2 database (local development)
# The database is created from scratch on every startup and wiped when the server stops
spring.datasource.url=jdbc:h2:mem:home-budget-api
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Shows the SQL generated by Hibernate in the console (useful for learning)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console: available at http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:mem:home-budget-api  |  User: sa  |  Password: (empty)
spring.h2.console.enabled=true
