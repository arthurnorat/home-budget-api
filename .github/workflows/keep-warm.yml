name: Keep API and DB warm

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API (hits DB to keep Neon warm too)
        run: |
          MONTH=$(date +%Y-%m)
          curl -sf "https://home-budget-api-wml2.onrender.com/expenses?month=${MONTH}" -o /dev/null